<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="title desc">
<title id="title">Trator Agro em movimento</title><desc id="desc">Trator verde com rodas girando e linhas de movimento sobre o solo.</desc>
<defs><linearGradient id="body" x2="0" y2="1"><stop stop-color="#91cb39"/><stop offset="1" stop-color="#3b7527"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#729c84"/><stop offset="1" stop-color="#1c392c"/></linearGradient></defs>
<style>
.tractor{animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 12px 10px #0006)}.rear{transform-origin:155px 182px;animation:spin 6s linear infinite}.front{transform-origin:316px 194px;animation:spin 4s linear infinite}.dust{animation:dust 2.8s ease-out infinite;fill:none;stroke:#a5e334;stroke-width:3;stroke-linecap:round}.d2{animation-delay:.9s}.d3{animation-delay:1.8s}.lamp{animation:light 3s ease-in-out infinite}.track{stroke:#547245;stroke-width:2;stroke-linecap:round;stroke-dasharray:22 32;animation:ground 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{50%{transform:translateY(-3px)}}@keyframes dust{0%{transform:translate(0,0);opacity:0}25%{opacity:.45}100%{transform:translate(-42px,-12px);opacity:0}}@keyframes light{50%{opacity:.55}}@keyframes ground{to{stroke-dashoffset:54}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.dust{opacity:.3}}
</style>
